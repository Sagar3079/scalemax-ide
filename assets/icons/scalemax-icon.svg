<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- ScaleMax app icon: a friendly 2D agent (headset, display visor, hexagon antenna) on the brand-green macOS tile. -->
  <defs>
    <linearGradient id="tile" x1="0.12" y1="0" x2="0.88" y2="1">
      <stop offset="0" stop-color="#3FEBC5"/>
      <stop offset="0.5" stop-color="#00C29A"/>
      <stop offset="1" stop-color="#008A72"/>
    </linearGradient>
    <radialGradient id="gloss" cx="0.3" cy="0.08" r="0.85">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="shell" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#DDF6EF"/>
    </linearGradient>
    <linearGradient id="torso" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F4FFFC"/>
      <stop offset="1" stop-color="#C6ECE2"/>
    </linearGradient>
    <linearGradient id="visor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#123A33"/>
      <stop offset="1" stop-color="#051714"/>
    </linearGradient>
    <filter id="tileShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#00241D" flood-opacity="0.30"/>
    </filter>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#00372C" flood-opacity="0.28"/>
    </filter>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="9" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="tileClip">
      <rect x="100" y="100" width="824" height="824" rx="185"/>
    </clipPath>
  </defs>

  <g filter="url(#tileShadow)">
    <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#tile)"/>
  </g>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#gloss)"/>

  <g clip-path="url(#tileClip)">
    <!-- faint brand hexagon behind the agent -->
    <path d="M512 150 820 328v356L512 862 204 684V328Z" fill="none" stroke="#FFFFFF" stroke-opacity="0.13" stroke-width="18" stroke-linejoin="round"/>

    <!-- shoulders -->
    <g filter="url(#softShadow)">
      <path d="M252 960V872c0-74 58-122 136-122h248c78 0 136 48 136 122v88Z" fill="url(#torso)"/>
    </g>
    <path d="M440 750h144l-72 58Z" fill="#00A585"/>
    <!-- neck -->
    <rect x="456" y="684" width="112" height="84" rx="24" fill="#0B2A24"/>

    <!-- antenna -->
    <path d="M512 330V246" stroke="#0B2A24" stroke-width="22" stroke-linecap="round"/>
    <g filter="url(#glow)">
      <path d="M512 160 550 182v44l-38 22-38-22v-44Z" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="10" stroke-linejoin="round"/>
    </g>
    <path d="m512 180 15 24-15 24-15-24Z" fill="#00B08D"/>

    <!-- headset ear cups -->
    <rect x="226" y="432" width="84" height="184" rx="42" fill="#0B2A24"/>
    <rect x="714" y="432" width="84" height="184" rx="42" fill="#0B2A24"/>

    <!-- head -->
    <g filter="url(#softShadow)">
      <rect x="280" y="316" width="464" height="396" rx="164" fill="url(#shell)"/>
    </g>
    <!-- headband -->
    <path d="M268 470C268 300 756 300 756 470" fill="none" stroke="#0B2A24" stroke-width="26" stroke-linecap="round"/>
    <rect x="248" y="468" width="22" height="112" rx="11" fill="#7CFFE0"/>
    <rect x="754" y="468" width="22" height="112" rx="11" fill="#7CFFE0"/>

    <!-- display visor with face -->
    <rect x="330" y="410" width="364" height="220" rx="110" fill="url(#visor)"/>
    <path d="M384 450c28-16 64-22 104-22" fill="none" stroke="#FFFFFF" stroke-opacity="0.22" stroke-width="12" stroke-linecap="round"/>
    <g filter="url(#glow)" fill="#7CFFE0">
      <rect x="420" y="468" width="52" height="84" rx="26"/>
      <rect x="552" y="468" width="52" height="84" rx="26"/>
      <path d="M476 580q36 26 72 0" fill="none" stroke="#7CFFE0" stroke-width="14" stroke-linecap="round"/>
    </g>

    <ellipse cx="392" cy="578" rx="26" ry="14" fill="#FF9CC6" fill-opacity="0.72"/>
    <ellipse cx="632" cy="578" rx="26" ry="14" fill="#FF9CC6" fill-opacity="0.72"/>

    <!-- microphone boom -->
    <path d="M268 596c4 70 48 96 124 96" fill="none" stroke="#0B2A24" stroke-width="18" stroke-linecap="round"/>
    <rect x="384" y="672" width="64" height="40" rx="20" fill="#0B2A24"/>
    <circle cx="424" cy="692" r="7" fill="#7CFFE0"/>
  </g>
</svg>
